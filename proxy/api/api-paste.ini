[composite:proxy+noauth]
use = egg:Paste#urlmap
/ = proxyversions_pipeline
/api/v1 = proxyv1_noauth_pipeline
/healthcheck = healthcheck

[composite:proxy+keystone]
use = egg:Paste#urlmap
/ = proxyversions_pipeline
/api/v1 = proxyv1_keystone_pipeline
/healthcheck = healthcheck

[app:healthcheck]
use = egg:oslo.middleware#healthcheck
oslo_config_project = proxy

[pipeline:proxyversions_pipeline]
pipeline = cors http_proxy_to_wsgi proxyversions

[app:proxyversions]
paste.app_factory = proxy.api.app:app_factory
root = proxy.api.controllers.root.VersionsController

[pipeline:proxyv1_keystone_pipeline]
pipeline = cors http_proxy_to_wsgi request_id authtoken proxyv1

[pipeline:proxyv1_noauth_pipeline]
pipeline = cors http_proxy_to_wsgi request_id proxyv1

[app:proxyv1]
paste.app_factory = proxy.api.app:app_factory
root = proxy.api.controllers.api.v1.root.V1Controller

[filter:authtoken]
paste.filter_factory = keystonemiddleware.auth_token:filter_factory
oslo_config_project = proxy

[filter:request_id]
paste.filter_factory = oslo_middleware:RequestId.factory

[filter:cors]
paste.filter_factory = oslo_middleware.cors:filter_factory
oslo_config_project = proxy

[filter:http_proxy_to_wsgi]
paste.filter_factory = oslo_middleware.http_proxy_to_wsgi:HTTPProxyToWSGI.factory
oslo_config_project = proxy
